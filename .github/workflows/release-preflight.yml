name: release-preflight

on:
  pull_request:
    branches: [master]
    paths:
      - "**.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Justfile"
      - "just/**"
      - "scripts/**"
      - "tests/**"
      - ".clippy.toml"
      - "rustfmt.toml"
      - "kal.json"
      - "lefthook.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: release-preflight-ubuntu-stable

      - name: Install just
        uses: taiki-e/install-action@v2.77.1
        with:
          tool: just

      - name: Resolve version
        id: version
        if: startsWith(github.head_ref, 'release/v')
        shell: bash
        run: scripts/release/verify-version.sh "${GITHUB_HEAD_REF#release/}"

      - name: Release check
        if: startsWith(github.head_ref, 'release/v')
        run: just VERSION="${{ steps.version.outputs.version }}" release-check
