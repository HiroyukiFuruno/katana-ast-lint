name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths:
      - "**.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/**"
      - "Justfile"
      - "just/**"
      - "scripts/**"
      - "tests/**"
      - ".clippy.toml"
      - "rustfmt.toml"
      - "kal.json"
      - "lefthook.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  test:
    if: >
      !(
        github.event.head_commit.committer.username == 'web-flow' &&
        (
          startsWith(github.event.head_commit.message, 'Merge pull request ') ||
          contains(github.event.head_commit.message, '(#')
        )
      )
    name: Test and Build
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js for OpenSpec
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          package-manager-cache: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        continue-on-error: true
        with:
          shared-key: ci-${{ matrix.os }}-stable-default

      - name: Install just
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just

      - name: Check types
        run: cargo check --workspace --locked

      - name: Check formatting
        run: just fmt-check

      - name: Run Clippy
        run: just lint

      - name: Run AST lint
        run: just ast-lint

      - name: Run tests
        run: just test

      - name: Validate OpenSpec
        if: matrix.os == 'ubuntu-latest'
        run: just openspec-check
