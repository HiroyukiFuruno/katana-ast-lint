[package]
name = "katana-ast-lint"
version = "0.5.2"
edition = "2024"
rust-version = "1.94.0"
license = "MIT"
description = "Reusable AST lint rules for KatanA ecosystem repositories"
repository = "https://github.com/HiroyukiFuruno/katana-ast-lint"
readme = "README.md"
keywords = ["katana", "lint", "ast", "rust"]
categories = ["development-tools"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "assets/**",
    "docs/**",
    "openspec/**",
    "src/**",
    "tests/**",
]

[lib]
name = "katana_ast_lint"
path = "src/lib.rs"

[[bin]]
name = "kal"
path = "src/bin/kal.rs"

[dependencies]
chrono = "0.4.45"
ignore = "0.4.33"
once_cell = "1.21.4"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
syn = { version = "3.0.6", features = ["full", "visit"] }

[dev-dependencies]
tempfile = "3.27.0"
