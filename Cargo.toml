[package]
name = "katana-ast-lint"
version = "0.2.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
description = "Reusable AST lint rules for KatanA ecosystem repositories"
repository = "https://github.com/HiroyukiFuruno/katana-ast-lint"
readme = "README.md"
keywords = ["katana", "lint", "ast", "rust"]
categories = ["development-tools"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "assets/**",
    "docs/**",
    "openspec/**",
    "src/**",
    "tests/**",
]

[lib]
name = "katana_ast_lint"
path = "src/lib.rs"

[dependencies]
chrono = "0.4.44"
ignore = "0.4.25"
once_cell = "1.21.4"
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
syn = { version = "2.0.117", features = ["full", "visit"] }

[dev-dependencies]
tempfile = "3.27.0"
