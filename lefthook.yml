no_tty: true
output:
  - failure

pre-commit:
  parallel: false
  commands:
    formatting:
      glob: "*.rs"
      run: just fmt

pre-push:
  commands:
    check-strict:
      run: just JOBS=2 check
      glob: "*.{rs,toml,lock}"
    dependency-and-issue-contract:
      run: scripts/hooks/validate-issue-and-dependency-contract.sh
      glob: "*.{rs,toml,md,lock}"
